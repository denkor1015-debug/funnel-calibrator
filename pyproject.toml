[project]
name = "funnel-calibrator"
version = "0.1.0"
description = "MCP server that recalibrates advertising decisions against observed sales-funnel performance"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Denys Kor" }]
keywords = ["mcp", "model-context-protocol", "unit-economics", "cod", "ecommerce"]

dependencies = [
    "mcp>=1.2.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
funnel-calibrator = "funnel_calibrator.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/funnel_calibrator"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
